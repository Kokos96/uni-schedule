<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Uni Schedule — університетський розклад занять, відвідуваність, дедлайни та сповіщення онлайн і офлайн" />
    <meta name="theme-color" content="#242522" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F0EB" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Розклад" />
    <link rel="icon" href="/icons/favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('uni_schedule_settings_v2');
          var parsed = raw ? JSON.parse(raw) : null;
          var pref = parsed && parsed.theme ? parsed.theme : 'dark';
          var resolved =
            pref === 'system'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
              : (pref === 'light' ? 'light' : 'dark');
          var root = document.documentElement;
          root.setAttribute('data-theme', resolved);
          root.style.backgroundColor = resolved === 'dark' ? '#242522' : '#F4F1EA';
          if (resolved === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.backgroundColor = '#242522';
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>Uni Schedule — Розклад занять</title>
  </head>
  <body class="bg-canvas text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/', updateViaCache: 'none' })
            .then(function (registration) {
              window.__swRegistration = registration;

              function notifyUpdate(worker) {
                if (!worker) return;
                window.dispatchEvent(
                  new CustomEvent('sw-update-available', {
                    detail: {
                      registration: registration,
                      worker: worker,
                      applyUpdate: function () {
                        worker.postMessage({ type: 'SKIP_WAITING' });
                      },
                    },
                  })
                );
              }

              if (registration.waiting) {
                notifyUpdate(registration.waiting);
              }

              registration.addEventListener('updatefound', function () {
                var newWorker = registration.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', function () {
                  if (
                    newWorker.state === 'installed' &&
                    navigator.serviceWorker.controller
                  ) {
                    notifyUpdate(newWorker);
                  }
                });
              });

              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') {
                  registration.update().catch(function () {});
                }
              });
            })
            .catch(function (err) {
              console.warn('Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
