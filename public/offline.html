<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#242522" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F0EB" media="(prefers-color-scheme: light)" />
    <title>Офлайн — Розклад ФЕП-33с</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #F2F0EB;
        --card: rgba(255, 255, 255, 0.78);
        --border: rgba(36, 37, 34, 0.12);
        --text: #1B1C19;
        --muted: #5C5D58;
        --accent: #D97724;
        --accent-text: #FFFFFF;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #242522;
          --card: rgba(30, 31, 29, 0.85);
          --border: rgba(255, 255, 255, 0.1);
          --text: #F5F4F0;
          --muted: #A4A59F;
          --accent: #E58A3C;
          --accent-text: #181816;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 380px;
        padding: 32px 24px;
        border-radius: 24px;
        background: var(--card);
        border: 1px solid var(--border);
        text-align: center;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.16);
      }

      .icon {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin: 0 auto 20px;
        display: block;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.3;
        font-weight: 700;
      }

      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.55;
        color: var(--muted);
      }

      button {
        appearance: none;
        width: 100%;
        padding: 13px 18px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }

      button:active {
        transform: scale(0.985);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="/icons/icon-192.png" alt="Розклад ФЕП-33с" width="72" height="72" />
      <h1>Немає з’єднання з інтернетом</h1>
      <p>
        Сторінка ще не збережена в кеші. Перевірте підключення до мережі та повторіть спробу.
      </p>
      <button type="button" id="retry-btn">Спробувати ще раз</button>
    </main>
    <script>
      document.getElementById('retry-btn').addEventListener('click', function () {
        window.location.reload();
      });
      window.addEventListener('online', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
